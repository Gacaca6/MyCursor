<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MyCursor — Leave the mouse at home</title>
<style>
@font-face{font-family:Bricolage;src:url('assets/display.ttf')}@font-face{font-family:Instrument;src:url('assets/body.ttf')}
*{box-sizing:border-box}body{margin:0;background:#141715;color:#141715;font-family:Instrument,sans-serif}#main{position:relative;width:1920px;height:1080px;overflow:hidden}.stage{position:absolute;inset:0}.ground{position:absolute;inset:-180px;background:radial-gradient(ellipse at 75% 60%,#d1e9dc 0,#f4f2ec 65%)}.night .ground{background:radial-gradient(ellipse at 64% 55%,#214535 0,#101715 66%)}.texture{position:absolute;inset:0;opacity:.12;background-image:url('assets/grain.png');mix-blend-mode:multiply;pointer-events:none}.night{color:#f4f2ec}.night .texture{mix-blend-mode:screen;opacity:.04}.scene{position:absolute;inset:0;overflow:hidden}.headline{position:absolute;left:140px;right:140px;top:392px;text-align:center;font:800 116px/.99 Bricolage;letter-spacing:-3px}.caption{position:absolute;left:140px;right:140px;top:886px;text-align:center;font:500 56px/1.15 Instrument;letter-spacing:-1px;z-index:5}.caption .back{display:inline-block;padding:12px 26px;background:#f4f2ec;border-radius:15px;color:#141715}.phone{position:absolute;display:block;filter:drop-shadow(0 28px 28px #0005);width:410px;height:auto}.macro{position:absolute;width:1470px;height:auto;left:225px;filter:drop-shadow(0 30px 40px #0004)}.wordmark{position:absolute;left:240px;right:240px;top:415px;text-align:center;font:800 145px/1 Bricolage;letter-spacing:-6px}.mark{width:110px;height:110px;vertical-align:middle;margin-right:25px;border-radius:24px}.mint{color:#0d6e52}.night .mint{color:#96e9ca}.gesture{position:absolute;width:68px;height:68px;border-radius:50%;background:#96e9ca;border:7px solid #f4f2ec;box-shadow:0 0 0 14px #96e9ca33;z-index:7}.cursor{position:absolute;width:68px;height:88px;z-index:7;filter:drop-shadow(0 6px 8px #0004)}.pc{position:absolute;left:250px;top:175px;width:1420px;height:700px;border-radius:20px;background:#fff;box-shadow:0 45px 75px #0002;border:2px solid #d9d5ca;overflow:hidden}.pc .doc{padding:80px 110px;font:500 51px/1.5 Instrument}.pc h2{font:700 84px/1.05 Bricolage;margin:0 0 35px}.pc .line{height:18px;border-radius:4px;background:#d7e2da;margin:30px 0;max-width:850px}.note{font:500 52px/1.35 Instrument}.symbol{position:absolute;left:815px;top:230px;width:290px;height:290px}.connection{position:absolute;height:4px;background:#96e9ca;left:565px;top:520px;width:790px;transform-origin:left}.node{position:absolute;top:365px;width:260px;height:300px}.bodycopy{position:absolute;left:260px;right:260px;text-align:center;font:500 61px/1.25 Instrument;top:665px}.setup{position:absolute;left:310px;top:315px;width:1300px;text-align:center;font:700 82px/1.2 Bricolage}.url{position:absolute;left:100px;right:100px;top:660px;text-align:center;font:600 60px/1.1 Instrument;color:#0d6e52}.cardfile{position:absolute;left:765px;top:270px;width:390px;height:420px;background:#fff;border-radius:18px;border:2px solid #d9d5ca;box-shadow:0 30px 50px #0002;padding:70px 40px;text-align:center;font:600 48px/1.2 Instrument}.ribbon{position:absolute;width:1050px;left:435px;height:110px;top:480px;border-radius:55px;background:#96e9ca;color:#141715;text-align:center;font:700 67px/110px Bricolage}
</style></head><body><div id="main" data-composition-id="main" data-width="1920" data-height="1080" data-duration="90"></div>
<script src="runtime/vendor/gsap.min.js"></script><script src="runtime/motion.js"></script>
<script>
const M=Motion.film({fps:30,duration:90,width:1920,height:1080,clock:'smooth'});
const main=document.getElementById('main');
const cursorSVG='<svg viewBox="0 0 64 84" fill="#f4f2ec" stroke="#141715" stroke-width="3"><path d="M4 4L56 47L32 50L22 76L4 4Z"/></svg>';
function shot(id,start,end,html,night=false){const el=document.createElement('section');el.id=id;el.className='scene'+(night?' night':'');el.innerHTML='<div class="ground"></div><div class="texture"></div><div class="stage">'+html+'</div>';main.append(el);M.show(el,start*30,end*30);M.mark(start*30,'cut',id);M.kf('#'+id+' .ground','x',[[start*30,-70],[end*30,70]]);return el}
function title(id,s,e,html,night=false,size=116){shot(id,s,e,`<div class="headline" style="font-size:${size}px">${html}</div>`,night);M.enter('#'+id+' .headline',{at:s*30,frames:16,from:{y:105,scale:1.1}});M.drift('#'+id+' .headline',{prop:'x',from:-14,to:14,start:s*30,end:e*30})}
function macro(id,s,e,img,fromY,toY,caption,night=true){shot(id,s,e,`<img class="macro" src="assets/device-${img}.webp"><div class="caption"><span class="back">${caption}</span></div>`,night);M.kf('#'+id+' .macro','y',[[s*30,fromY],[(s+.45)*30,fromY-30,'softLand'],[e*30,toY]]);M.enter('#'+id+' .caption',{at:s*30+7,frames:12,from:{y:90}});return id}
// The missing mouse leads directly to the phone already in your pocket.
title('forgot',0,3,'Forgot your mouse?');
shot('phone-answer',3,6.5,'<img class="phone" src="assets/device-pad.webp" style="left:785px;top:100px;width:350px"><div class="caption">You brought your phone.</div>');
M.enter('#phone-answer .phone',{at:90,frames:18,from:{y:900,rotation:18,scale:1.25}});M.kf('#phone-answer .phone','rotation',[[108,-5],[195,3]]);M.drift('#phone-answer .phone',{prop:'y',from:0,to:-30,start:108,end:195});
shot('identity',6.5,9,'<div class="wordmark"><img class="mark" src="assets/icon.png">MyCursor</div>');M.enter('#identity .wordmark',{at:195,frames:16,from:{scale:1.6,y:40}});M.drift('#identity .wordmark',{prop:'x',from:-12,to:12,start:211,end:270});
macro('pad-real',9,13,'pad',-90,-220,'Your phone becomes your Windows touchpad.');
macro('pad-gesture',13,17,'pad',-480,-620,'Slide to move. Tap to click.');
const g=document.createElement('div');g.id='pad-touch';g.className='gesture';document.querySelector('#pad-gesture .stage').append(g);M.kf(g,'x',[[390,650],[425,1060,'glide'],[460,900,'glide'],[510,1040]]);M.kf(g,'y',[[390,490],[425,350,'glide'],[460,520,'glide'],[510,400]]);
macro('scroll',17,20.5,'pad',-1740,-1810,'One thumb. A proper scroll wheel.');
shot('scroll-result',20.5,24,'<div class="pc" data-ui="illustrative"><div class="doc"><h2>Presentation notes</h2><p>Start with the problem.</p><p>Show what changes.</p><p>Let the product do the talking.</p><p>Leave space for questions.</p></div></div><div class="cursor">'+cursorSVG+'</div><div class="caption">Your PC follows.</div>');M.kf('#scroll-result .doc','y',[[615,70],[720,-270]]);M.cursor('#scroll-result .cursor',{keys:[[615,1530,700,1,0],[720,1500,540,1,0]]});
macro('keyboard',24,28,'typing',-1250,-1400,'Type on your phone. See it on your PC.');
title('present-turn',28,30,'Now walk away<br>from the laptop.',false,106);
macro('present-next',30,34,'present',-1970,-2040,'Your next slide is in your hand.');
shot('slide-result',34,37,'<div class="pc" data-ui="illustrative" style="background:#0d6e52;color:#f4f2ec"><div class="doc"><h2 style="font-size:114px;margin-top:75px">Make your<br>next idea move.</h2></div></div><div class="caption">Present from where you want to stand.</div>');M.kf('#slide-result .pc','scale',[[1020,1.08],[1110,1]]);M.drift('#slide-result .pc',{prop:'x',from:-20,to:20,start:1020,end:1110});
macro('speaker-notes',37,41,'present',-400,-520,'PowerPoint notes stay on your phone.');
macro('talk-timer',41,44,'present',-120,-220,'Keep an eye on your talk timer.');
title('sofa-turn',44,46,'Stay on the sofa.',true,110);
macro('media-controls',46,50,'media',-2030,-2110,'Play. Pause. Skip. Turn it up.');
macro('media-sleep',50,53,'media',-100,-220,'Set a sleep timer for your PC.');
title('sharing-turn',53,55,'Your file does not<br>need a cable.',false,108);
macro('sharing',55,59,'share',-200,-370,'Send photos, videos and files.');
macro('sharing-more',59,62,'share',-1160,-1300,'Phone to PC. PC to phone.');
shot('file-result',62,65,'<div class="cardfile" data-ui="illustrative"><svg width="110" height="125" viewBox="0 0 100 120" fill="none" stroke="#0d6e52" stroke-width="6"><path d="M15 5h45l25 25v85H15zM60 5v30h25M30 60h40M30 80h30"/></svg><p style="margin-top:20px">Lecture<br>notes.pdf</p></div><div class="caption">Straight to Downloads on your PC.</div>');M.kf('#file-result .cardfile','y',[[1860,-50],[1876,0,'softLand'],[1950,-25]]);M.kf('#file-result .cardfile','rotation',[[1860,-10],[1876,0,'softLand'],[1950,3]]);
title('offline-turn',65,68,'Internet is optional.',true,122);
shot('offline-proof',68,72,'<svg class="node" style="left:400px" viewBox="0 0 200 250" fill="none" stroke="#f4f2ec" stroke-width="8"><rect x="42" y="5" width="115" height="215" rx="22"/><path d="M80 195h40"/></svg><div class="connection"></div><svg class="node" style="left:1260px" viewBox="0 0 250 250" fill="none" stroke="#f4f2ec" stroke-width="8"><rect x="10" y="30" width="225" height="150" rx="12"/><path d="M90 180v35M155 180v35M65 215h115"/></svg><div class="caption">Use the same Wi-Fi or your PC’s offline hotspot.</div>',true);M.kf('#offline-proof .connection','scaleX',[[2040,.1],[2065,1,'softLand'],[2160,1.04]]);M.drift('#offline-proof .node',{prop:'y',from:0,to:-28,start:2040,end:2160});
title('account',72,74.5,'No account to create.',false,110);
title('phone-install',74.5,77,'Nothing to install<br>on your phone.',false,106);
shot('beta-offer',77,81,'<div class="headline" style="top:290px;font-size:135px">Every feature.</div><div class="ribbon">Free during beta.</div>');M.enter('#beta-offer .headline',{at:2310,frames:15,from:{y:100,scale:1.2}});M.enter('#beta-offer .ribbon',{at:2330,frames:14,from:{x:-1500}});M.drift('#beta-offer .ribbon',{prop:'x',from:-20,to:20,start:2344,end:2430});
shot('setup',81,84.5,'<div class="setup">Download for Windows.<br>Scan the code.<br>Take control.</div>');M.enter('#setup .setup',{at:2430,frames:14,from:{y:95}});M.drift('#setup .setup',{prop:'scale',from:1,to:1.035,start:2444,end:2535});
shot('try',84.5,88.5,'<div class="headline" style="top:315px;font-size:115px">Try MyCursor.</div><div class="url">gacaca6.github.io/MyCursor</div>');M.enter('#try .headline',{at:2535,frames:14,from:{scale:1.14,y:40}});M.enter('#try .url',{at:2547,frames:13,from:{y:70}});M.drift('#try .stage',{prop:'y',from:0,to:-20,start:2535,end:2655});
shot('signoff',88.5,90,'<div class="wordmark" style="font-size:100px;top:465px"><img class="mark" src="assets/icon.png" style="width:84px;height:84px">MyCursor</div>');M.enter('#signoff .wordmark',{at:2655,frames:12,from:{scale:1.25,y:30}});M.drift('#signoff .wordmark',{prop:'x',from:-10,to:10,start:2667,end:2700});
window.__ready=Motion.loaded().then(()=>{if(new URLSearchParams(location.search).has('selftest')){const result=Motion.selfTest(M,{samples:14});console.log(JSON.stringify(result));return result;}});
</script></body></html>
