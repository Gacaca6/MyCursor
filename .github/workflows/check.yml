name: Phone touchpad checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-phone.txt
      - run: python -m unittest discover -s tests -p test_phone.py
  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-phone.txt
      - run: npm install
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser controls and Home Screen checks
        env:
          MYCURSOR_TEST_BROWSER: ${{ matrix.browser }}
        run: |
          python tools/phone_test_server.py > /tmp/mycursor-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/health; then break; fi
            sleep 1
          done
          npm run test:browser
